<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            background: #f5f5f5;
        }

        .box {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="top-header">
        <h1>Fuel QR Registration System</h1>

        <div class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Logout
        </div>

    </div>


    <div class="navbar">

        <div class="nav-item">
            <i class="fa-solid fa-house"></i>
            Home
        </div>

        <div class="nav-item">
            <i class="fa-solid fa-car"></i>
            Vehicle
        </div>

        <div class="nav-item">
            <i class="fa-solid fa-qrcode"></i>
            QR Code
        </div>

        <div class="nav-item">
            <i class="fa-solid fa-gauge"></i>
            Quota
        </div>

    </div>


    <div class="box">

        <h2 class="text-center mb-4">
            Vehicle QR Generator
        </h2>

        <input type="text" id="vehicleNo" class="form-control mb-3" placeholder="Enter Vehicle Registration Number">

        <button class="btn btn-primary w-100" id="generateBtn" style="background: Black, border-color: Black">
            Generate QR Code
        </button>

        <div id="qrcode"></div>

    </div>

    <script>

        $(document).ready(function () {

            $("#generateBtn").click(function () {

                let vehicleNumber = $("#vehicleNo").val();

                if (vehicleNumber == "") {
                    alert("Please enter vehicle number");
                    return;
                }

                // Clear old QR
                $("#qrcode").html("");

                // Generate QR
                new QRCode(document.getElementById("qrcode"), {

                    text: JSON.stringify({
                        vehicleNo: vehicleNumber,
                        fuelType: "Petrol",
                        quota: 20
                    }),

                    width: 250,
                    height: 250,

                    colorDark: "#000000",
                    colorLight: "#ffffff",

                    correctLevel: QRCode.CorrectLevel.H
                });

            });

        });

    </script>

</body>

</html>
