<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <title>QR Generator (Admin)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f3f5f7;
            color: #000;
        }

        .box {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .top-header {
            background: #fff;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .top-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .logout {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .custom-navbar {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            gap: 40px;
            border-bottom: 1px solid #ddd;
        }

        .custom-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #000;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user || user.role !== 'admin') {
            window.location.href = '/';
        }
    </script>

    <div class="top-header">
        <h1>Fuel QR Registration System (ADMIN)</h1>
        <div class="logout" id="logoutBtn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </div>
    </div>

    


    <div class="custom-navbar">
        <a href="admin.html" class="custom-nav-item ">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="station.html" class="custom-nav-item">
            <i class="fa-solid fa-location-dot"></i> Station
        </a>
        <a href="fueltype.html" class="custom-nav-item">
            <i class="fa-solid fa-file"></i> Fuel Type
        </a>
        <a href="vehicleModel.html" class="custom-nav-item">
            <i class="fa-solid fa-car"></i> Vehicle
        </a>
        <a href="qrgen.html" class="custom-nav-item">
            <i class="fa-solid fa-qrcode"></i> QR Code
        </a>
        <a href="quotaAdmin.html" class="custom-nav-item">
            <i class="fa-solid fa-gauge"></i> Quota
        </a>
    </div>

    <div class="box">
        <h2 class="text-center mb-4">Vehicle QR Generator</h2>

        <div class="mb-3">
            <label class="form-label">Vehicle Registration Number</label>
            <input type="text" id="vehicleNo" class="form-control" placeholder="Enter Registration No (e.g. ABC 1234)">
        </div>

        <button class="btn w-100" id="generateBtn" style="background-color: #111827; color: white;">
            Generate & Assign QR Code
        </button>

        <div id="qrcode"></div>
    </div>

    <script>
        $(document).ready(function () {
            $('#logoutBtn').on('click', function () {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            });

            $("#generateBtn").click(function () {
                let vehicleNumber = $("#vehicleNo").val().trim();

                if (vehicleNumber == "") {
                    alert("Please enter vehicle number");
                    return;
                }

                // 1. Fetch vehicle details to verify existence
                $.ajax({
                    url: `/api/vehicles?role=admin`, // Fetch all to find the specific one
                    method: 'GET',
                    success: function (vehicles) {
                        const vehicle = vehicles.find(v => v.vehicleNo.toLowerCase().replace(/\s/g, '') === vehicleNumber.toLowerCase().replace(/\s/g, ''));

                        if (!vehicle) {
                            alert("Error: Vehicle '" + vehicleNumber + "' not found in system.");
                            return;
                        }

                        // 2. Generate a random payload tracking code
                        let generatedCode = "QR-" + Math.floor(1000000000 + Math.random() * 9000000000) + "-" + vehicle.vehicleNo.toUpperCase().replace(/\s/g, '');

                        // 3. Update vehicle on backend
                        $.ajax({
                            url: `/api/vehicles/${vehicle.vehicleNo}/qr`,
                            method: 'PATCH',
                            contentType: 'application/json',
                            data: JSON.stringify({ qrString: generatedCode }),
                            success: function (updatedVehicle) {
                                // 4. Draw QR Code
                                $("#qrcode").html("");
                                new QRCode(document.getElementById("qrcode"), {
                                    text: JSON.stringify({
                                        vehicleNo: updatedVehicle.vehicleNo,
                                        fuelType: updatedVehicle.fuelType,
                                        quota: updatedVehicle.quota,
                                        qrCodeString: generatedCode
                                    }),
                                    width: 250,
                                    height: 250,
                                    colorDark: "#000000",
                                    colorLight: "#ffffff",
                                    correctLevel: QRCode.CorrectLevel.H
                                });

                                alert("Success! QR Code generated and assigned to " + updatedVehicle.vehicleNo);
                            },
                            error: function () {
                                alert("Failed to update QR string on server.");
                            }
                        });
                    },
                    error: function () {
                        alert("Failed to connect to server.");
                    }
                });
            });
        });
    </script>

</body>

</html>
