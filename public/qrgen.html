<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <title>QR Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f3f5f7;
            color: #000;
        }

        .box {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .top-header {
            background: #fff;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .top-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .logout {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .custom-navbar {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            gap: 40px;
            border-bottom: 1px solid #ddd;
        }

        .custom-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #000;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="top-header">
        <h1>Fuel QR Registration System</h1>
        <div class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </div>
    </div>

    <div class="custom-navbar">
        <a href="../index.html" class="custom-nav-item">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <div class="custom-nav-item">
            <i class="fa-solid fa-car"></i> Vehicle
        </div>
        <a href="qrgen.html" class="custom-nav-item">
            <i class="fa-solid fa-qrcode"></i> QR Code
        </a>
        <div class="custom-nav-item">
            <i class="fa-solid fa-gauge"></i> Quota
        </div>
    </div>

    <div class="box">
        <h2 class="text-center mb-4">Vehicle QR Generator</h2>

        <input type="text" id="vehicleNo" class="form-control mb-3" placeholder="Enter Vehicle Registration Number">

        <button class="btn w-100" id="generateBtn" style="background-color: #111827; color: white;">
            Generate QR Code
        </button>

        <div id="qrcode"></div>
    </div>

    <script>
        $(document).ready(function () {
            $("#generateBtn").click(function () {
                let vehicleNumber = $("#vehicleNo").val().trim();

                if (vehicleNumber == "") {
                    alert("Please enter vehicle number");
                    return;
                }

                let vehiclesData = localStorage.getItem('registeredVehicles');
                let vehicles = [];

                if (vehiclesData) {
                    vehicles = JSON.parse(vehiclesData);
                }

                let cleanInput = vehicleNumber.replace(/[\s-]/g, '').toLowerCase();

                let vehicleIndex = vehicles.findIndex(function (v) {
                    let cleanStoredNo = v.vehicleNo.replace(/[\s-]/g, '').toLowerCase();
                    return cleanStoredNo === cleanInput;
                });

                if (vehicleIndex === -1) {
                    alert("Error: Vehicle '" + vehicleNumber + "' not found.\n\nMake sure you registered it on the Home screen first!");
                    return;
                }

                // Generate a random payload tracking code
                let generatedCode = "QR-" + Math.floor(1000000000 + Math.random() * 9000000000) + "-" + cleanInput.toUpperCase();

                // Update dataset fields property values
                vehicles[vehicleIndex].qrString = generatedCode;

                // Save back to storage array mapping key container
                localStorage.setItem('registeredVehicles', JSON.stringify(vehicles));

                // Clear and draw the large master admin display panel preview graphic
                $("#qrcode").html("");
                new QRCode(document.getElementById("qrcode"), {
                    text: JSON.stringify({
                        vehicleNo: vehicles[vehicleIndex].vehicleNo,
                        fuelType: vehicles[vehicleIndex].fuelType,
                        quota: vehicles[vehicleIndex].quota,
                        qrCodeString: generatedCode
                    }),
                    width: 250,
                    height: 250,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                alert("Success! QR Code graphics generated and assigned to " + vehicles[vehicleIndex].vehicleNo);
            });
        });
    </script>

</body>

</html>
