<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />


    <title>QR Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f3f5f7;
            color: #000;
        }

        .box {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .top-header {
            background: #fff;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .top-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .logout {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }


        .custom-navbar {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            gap: 40px;
            border-bottom: 1px solid #ddd;
        }

        .custom-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #000;
            text-decoration: none;
        }


        .container {
            padding: 50px 40px;
        }

        .welcome-title {
            font-size: 50px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 20px;
            margin-bottom: 40px;
        }


        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            border: 1px solid #e5e7eb;
        }

        .card-title {
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-subtitle {
            color: #6b7280;
            margin-bottom: 40px;
            font-size: 18px;
        }


        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px 80px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            background: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }


        .btn {
            margin-top: 40px;
            padding: 16px 35px;
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #000;
        }


        @media(max-width:900px) {

            .custom-navbar {
                flex-wrap: wrap;
                gap: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .welcome-title {
                font-size: 38px;
            }

            .card-title {
                font-size: 30px;
            }

        }
    </style>
</head>

<body>

    <div class="top-header">
        <h1>Fuel QR Registration System</h1>

        <div class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Logout
        </div>

    </div>


    <div class="custom-navbar">

        <a href="../index.html" class="custom-nav-item">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <div class="custom-nav-item">
            <i class="fa-solid fa-car"></i>
            Vehicle
        </div>

        <a href="qrgen.html" class="custom-nav-item">
            <i class="fa-solid fa-qrcode"></i>
            QR Code
        </a>

        <div class="custom-nav-item">
            <i class="fa-solid fa-gauge"></i>
            Quota
        </div>

    </div>


    <div class="box">

        <h2 class="text-center mb-4">
            Vehicle QR Generator
        </h2>

        <input type="text" id="vehicleNo" class="form-control mb-3" placeholder="Enter Vehicle Registration Number">

        <button class="btn btn-primary w-100" id="generateBtn" style="background: Black, border-color: Black">
            Generate QR Code
        </button>

        <div id="qrcode"></div>

    </div>

    <script>
        $(document).ready(function () {

            $("#generateBtn").click(function () {

                let vehicleNumber = $("#vehicleNo").val().trim();

                if (vehicleNumber == "") {
                    alert("Please enter vehicle number");
                    return;
                }

                // 1. Fetch current registered vehicles from localStorage
                let vehicles = JSON.parse(localStorage.getItem('registeredVehicles')) || [];

                // Helper to strip spaces/dashes for an accurate comparison match
                let cleanInput = vehicleNumber.replace(/[\s-]/g, '').toLowerCase();

                // 2. Find the vehicle index matching the registration number
                let vehicleIndex = vehicles.findIndex(function (v) {
                    let cleanStoredNo = v.vehicleNo.replace(/[\s-]/g, '').toLowerCase();
                    return cleanStoredNo === cleanInput;
                });

                // If not found, tell the admin exactly what went wrong
                if (vehicleIndex === -1) {
                    alert("Error: Vehicle registration '" + vehicleNumber + "' was not found in the system. Please register it on the home page first.");
                    return;
                }

                // 3. Generate a clean random code string matching your system style
                let generatedCode = "QR-" + Math.floor(1000000000 + Math.random() * 9000000000) + "-" + cleanInput.toUpperCase();

                // 4. Update the array item property 
                vehicles[vehicleIndex].qrString = generatedCode;

                // 5. Save the updated array back to localStorage
                localStorage.setItem('registeredVehicles', JSON.stringify(vehicles));

                // 6. Clear old visual QR graphic and make the new one
                $("#qrcode").html("");

                new QRCode(document.getElementById("qrcode"), {
                    text: JSON.stringify({
                        vehicleNo: vehicles[vehicleIndex].vehicleNo,
                        fuelType: vehicles[vehicleIndex].fuelType,
                        quota: vehicles[vehicleIndex].quota,
                        qrCodeString: generatedCode
                    }),
                    width: 250,
                    height: 250,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                alert("Success! QR Code generated and linked to " + vehicles[vehicleIndex].vehicleNo);
            });

        });
    </script>

</body>

</html>
