<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel QR Registration System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f3f5f7;
      color: #000;
    }

    .top-header {
      background: #fff;
      padding: 25px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .top-header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .logout {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 500;
    }

  
    .navbar {
      background: #fff;
      padding: 20px 40px;
      display: flex;
      gap: 40px;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 500;
      color: #000;
      text-decoration: none;
    }


    .container {
      padding: 50px 40px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 35px;
      border: 1px solid #e5e7eb;
      overflow-x: auto;
      margin-bottom: 40px;
    }

    .table-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .table-subtitle {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 35px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    thead {
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      text-align: left;
      padding: 18px 20px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 600;
    }

    td {
      padding: 25px 20px;
      font-size: 16px;
    }

    .qr-text {
      font-size: 14px;
    }

    .status {
      background: #020617;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      display: inline-block;
    }

    .form-group-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
    }

    .form-field {
      flex: 1;
      min-width: 200px;
    }

    .form-field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }

    .form-field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .submit-btn {
      background: #020617;
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      font-size: 15px;
      height: 48px;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: #1e293b;
    }

    @media(max-width:900px) {
      .table-title {
        font-size: 28px;
      }

      .navbar {
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="top-header">
    <h1>Fuel QR Registration System</h1>
    <div class="logout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      Logout
    </div>
  </div>


  <div class="navbar">
    <a href="admin.html" class="nav-item">
      <i class="fa-solid fa-house"></i> Home
    </a>
    <a href="station.html" class="nav-item">
      <i class="fa-solid fa-location-dot"></i> Station
    </a>
    <a href="fueltype.html" class="nav-item">
      <i class="fa-solid fa-file"></i> Fuel Type
    </a>
    <a href="vehicleModel.html" class="nav-item">
      <i class="fa-solid fa-car"></i> Vehicle
    </a>
    <a href="qrgen.html" class="nav-item">
      <i class="fa-solid fa-qrcode"></i> QR Code
    </a>
    <a href="quotaAdmin.html" class="nav-item">
      <i class="fa-solid fa-gauge"></i> Quota
    </a>
  </div>

  <div class="container">

    <div class="card">
      <h2 class="table-title">Add a new Quota</h2>
      <p class="table-subtitle">Configure system-wide fuel limits for registered vehicles.</p>

      <form id="quotaForm" class="form-group-container">
        <div class="form-field">
          <label for="vehicleType">Quota Name</label>
          <input type="text" id="vehicleType" required placeholder="e.g., Car, Van, Three-Wheel">
        </div>
        <div class="form-field">
          <label for="allowedLiters">Allowed Liters / Week</label>
          <input type="number" id="allowedLiters" required placeholder="e.g., 20">
        </div>
        <button type="submit" class="submit-btn">Save Quota</button>
      </form>
    </div>

    <div class="card">
      <h2 class="table-title">Recently Added Quotas</h2>
      <p class="table-subtitle">Live status tracking of fuel allowance allocations.</p>

      <table>
        <thead>
          <tr>
            <th>Quota ID</th>
            <th>Quota Name</th>
            <th>Allocated Volume</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="quotaTableBody">
        </tbody>
      </table>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const quotaForm = document.getElementById('quotaForm');
      const quotaTableBody = document.getElementById('quotaTableBody');

      //getting data from mongo using rest api
      async function loadQuotas() {
        try {
          const response = await fetch('/api/quotas');
          const quotas = await response.json();

          quotaTableBody.innerHTML = '';

          if (!quotas || quotas.length === 0) {
            quotaTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #6b7280; padding: 30px;">No quotas found in the system.</td></tr>`;
            return;
          }

          quotas.forEach(quota => {
            const row = document.createElement('tr');
            row.style.borderBottom = "1px solid #e5e7eb";

            const shortId = quota._id ? quota._id.substring(18) : 'N/A';

            row.innerHTML = `
              <td class="qr-text" style="color: #6b7280;">#${shortId}</td>
              <td style="font-weight: 500;">${quota.vehicleType}</td>
              <td><strong>${quota.allowedLiters} L</strong></td>
              <td><span class="status">${quota.status || 'Active'}</span></td>
            `;
            quotaTableBody.appendChild(row);
          });
        } catch (error) {
          console.error('AJAX Data Retrieval Exception:', error);
        }
      }

      //post new form inputs as JSON to Node js 
      quotaForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const vType = document.getElementById('vehicleType').value;
        const vLiters = document.getElementById('allowedLiters').value;

        const payload = {
          vehicleType: vType,
          allowedLiters: parseInt(vLiters, 10)
        };

        try {
          const response = await fetch('/api/quotas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            alert('Quota saved successfully!');
            quotaForm.reset(); 
            await loadQuotas(); //  rebuilds table rows using ajax without reloading
          } else {
            const err = await response.json();
            alert('Server rejected submission: ' + (err.error || 'Unknown Error'));
          }
        } catch (error) {
          console.error('AJAX Form Post Exception:', error);
          alert('Network communication failure.');
        }
      });

      
      loadQuotas();
    });
  </script>
</body>

</html>
