<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fuel QR Registration</title>
    <meta name="description" content="Login to access your fuel registration details and manage your QR code.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-card container">
        <header class="header mb-4 text-center">
            <h1 id="main-title" class="display-6 fw-bold">Fuel QR Registration</h1>
            <p class="text-muted">Login to access your fuel registration details</p>
        </header>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="your.email@example.com"
                    required autocomplete="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required autocomplete="current-password">
                    <button class="toggle-password" type="button">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-3" id="login-button">
                <span>Login</span>
            </button>
        </form>

        <footer class="footer-text mt-4 text-center">
            <p>Don't have an account? <a href="signup.html" id="signup-link" class="text-decoration-none">Sign up</a>
            </p>
        </footer>
    </main>

    <div id="toast" class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-primary border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
</body>

</html>
