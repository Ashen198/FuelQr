<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel QR Registration System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f3f5f7;
      color: #000;
    }


    .top-header {
      background: #fff;
      padding: 25px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .top-header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .logout {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 500;
    }


    .navbar {
      background: #fff;
      padding: 20px 40px;
      display: flex;
      gap: 40px;
      border-bottom: 1px solid #ddd;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 500;
      color: #000;
      text-decoration: none;
    }


    .container {
      padding: 50px 40px;
    }

    .welcome-title {
      font-size: 50px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 20px;
      margin-bottom: 40px;
    }


    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      border: 1px solid #e5e7eb;
    }

    .card-title {
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card-subtitle {
      color: #6b7280;
      margin-bottom: 40px;
      font-size: 18px;
    }


    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px 80px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
      background: #fff;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
    }


    .btn {
      margin-top: 40px;
      padding: 16px 35px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #000;
    }


    @media(max-width:900px) {

      .navbar {
        flex-wrap: wrap;
        gap: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .welcome-title {
        font-size: 38px;
      }

      .card-title {
        font-size: 30px;
      }

    }
  </style>
</head>

<body>


  <div class="top-header">
    <h1>Fuel QR Registration System</h1>

    <div class="logout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      Logout
    </div>
  </div>


  <div class="navbar">

    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      Home
    </a>

    <div class="nav-item">
      <i class="fa-solid fa-car"></i>
      Vehicle
    </div>

    <a href="public/qrgen.html" class="nav-item">
      <i class="fa-solid fa-qrcode"></i>
      QR Code
    </a>

    <div class="nav-item">
      <i class="fa-solid fa-gauge"></i>
      Quota
    </div>

  </div>


  <div class="container">

    <h1 class="welcome-title">Welcome!</h1>
    <p class="subtitle">Manage your fuel quota registrations</p>

    <!-- CARD -->

    <div class="card" id="registrationFormCard">

      <h2 class="card-title">
        <i class="fa-solid fa-plus"></i>
        Register New Vehicle
      </h2>

      <p class="card-subtitle">
        Add a vehicle to the fuel quota system
      </p>

      <!-- FORM -->

      <form id="vehicleRegForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Vehicle Registration No</label>
            <input type="text" id="vehicleNo" placeholder="ABC-1234" required>
          </div>

          <div class="form-group">
            <label>Vehicle Model</label>
            <input type="text" id="vehicleModel" placeholder="Toyota Corolla 2020" required>
          </div>

          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" required>
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>

          <div class="form-group">
            <label>Owner NIC</label>
            <input type="text" id="nic" placeholder="123456789V" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="abc@gmail.com" required>
          </div>

          <div class="form-group">
            <label>Fuel Type</label>

            <select id="fuelType" required>
              <option value="">Select fuel type</option>
              <option value="Petrol">Petrol</option>
              <option value="Diesel">Diesel</option>
            </select>
          </div>

          <div class="form-group">
            <label>Nearest Fuel Station</label>

            <select id="station" required>
              <option value="">Select station</option>
              <option value="IOC Station">IOC Station</option>
              <option value="Ceypetco">Ceypetco</option>
            </select>
          </div>

          <div class="form-group">
            <label>Weekly Fuel Quota (Liters)</label>
            <input type="number" id="quota" placeholder="40" required min="1">
          </div>

        </div>

        <button class="btn">Register Vehicle</button>

      </form>

    </div>

    <!-- SUCCESS DETAILS CONTAINER (initially hidden) -->
    <div id="successDetailsContainer" style="display: none;">
      
      <!-- Back button / Register New Vehicle button on top -->
      <button class="btn" id="btnNewVehicle" style="margin-top: 0; margin-bottom: 30px; background: #111827; color: #fff;">
        <i class="fa-solid fa-plus" style="margin-right: 8px;"></i>
        Register New Vehicle
      </button>

      <!-- CARD showing details -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 30px;">
          <div style="flex: 2; min-width: 300px;">
            <h2 class="card-title" style="color: #10b981; font-size: 32px; margin-bottom: 25px; display: flex; align-items: center; gap: 12px;">
              <i class="fa-solid fa-circle-check"></i> Registration Successful!
            </h2>
            <div class="details-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px 40px;">
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Vehicle Registration No</label>
                <div id="displayVehicleNo" style="font-size: 20px; font-weight: 700; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Vehicle Model</label>
                <div id="displayVehicleModel" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Owner Name</label>
                <div id="displayOwnerName" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Owner NIC</label>
                <div id="displayNic" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Email Address</label>
                <div id="displayEmail" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Fuel Type</label>
                <div id="displayFuelType" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Fuel Station</label>
                <div id="displayStation" style="font-size: 18px; font-weight: 500; color: #111827; margin-top: 5px;"></div>
              </div>
              <div>
                <label style="font-weight: 600; color: #6b7280; font-size: 14px; text-transform: uppercase;">Weekly Quota</label>
                <div id="displayQuota" style="font-size: 20px; font-weight: 700; color: #2563eb; margin-top: 5px;"></div>
              </div>
            </div>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; border-radius: 15px; padding: 30px; border: 1px dashed #cbd5e1; min-width: 250px; align-self: center;">
            <div id="displayQrCode"></div>
            <p style="margin-top: 15px; font-size: 14px; color: #6b7280; font-weight: 500; text-align: center;">Scan to verify weekly fuel quota</p>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    $(document).ready(function() {
      // Handle form submission
      $('#vehicleRegForm').on('submit', function(e) {
        e.preventDefault();

        // Retrieve form values
        const vehicleNo = $('#vehicleNo').val().trim();
        const vehicleModel = $('#vehicleModel').val().trim();
        const firstName = $('#firstName').val().trim();
        const lastName = $('#lastName').val().trim();
        const nic = $('#nic').val().trim();
        const email = $('#email').val().trim();
        const fuelType = $('#fuelType').val();
        const station = $('#station').val();
        const quota = $('#quota').val().trim();

        // Populate display elements
        $('#displayVehicleNo').text(vehicleNo);
        $('#displayVehicleModel').text(vehicleModel);
        $('#displayOwnerName').text(firstName + ' ' + lastName);
        $('#displayNic').text(nic);
        $('#displayEmail').text(email);
        $('#displayFuelType').text(fuelType);
        $('#displayStation').text(station);
        $('#displayQuota').text(quota + ' Liters');

        // Clear previous QR Code if any
        $('#displayQrCode').html('');

        // Generate QR Code
        new QRCode(document.getElementById("displayQrCode"), {
          text: JSON.stringify({
            vehicleNo: vehicleNo,
            ownerName: firstName + ' ' + lastName,
            nic: nic,
            email: email,
            fuelType: fuelType,
            station: station,
            quota: parseInt(quota, 10)
          }),
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        // Hide form card and show success details
        $('#registrationFormCard').hide();
        $('#successDetailsContainer').fadeIn();
      });

      // Handle "Register New Vehicle" button click
      $('#btnNewVehicle').on('click', function() {
        // Reset the form
        $('#vehicleRegForm')[0].reset();

        // Hide success details and show form card
        $('#successDetailsContainer').hide();
        $('#registrationFormCard').fadeIn();
      });
    });
  </script>

</body>

</html>
